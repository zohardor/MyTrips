<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>טיול | הטיולים שלי</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E✈️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F9; --card:#FFFFFF; --ink:#0F1C2E; --muted:#5A687C; --line:#DCE2EA; --soft:#EBEFF4;
  --red:#B5267F; --blue:#1E5DAE; --amber:#B8770B; --green:#22825A; --violet:#6B4FB3; --gray:#7E8898; --grid:#C9D3DF;
  --display:"Barlow Condensed","IBM Plex Sans Hebrew",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0C1522; --card:#121E2F; --ink:#E4EAF2; --muted:#93A1B5; --line:#24324A; --soft:#18263A;
    --red:#E25AAE; --blue:#7FA9EC; --amber:#E2A440; --green:#4CB98A; --violet:#A68CE6; --gray:#8B96A8; --grid:#2A3A55; }
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Hebrew","Arial Hebrew","Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.6;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-weight:600;margin:0;line-height:1.25}
h2{font-size:1.4rem;margin-bottom:12px}
.wrap{max-width:1040px;margin:0 auto;padding:22px 20px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;color:var(--muted);font-size:.92rem}
.top a{color:var(--blue)}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
section{margin-top:36px}

.flight{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 26px}
.route{display:flex;align-items:flex-end;justify-content:space-between;direction:ltr}
.code{font-family:var(--display);font-weight:600;font-size:clamp(3rem,9vw,5.6rem);line-height:.9;letter-spacing:.02em}
.code.custom{font-size:clamp(1.9rem,5vw,3.2rem)}
.code.origin{color:var(--muted)}
.route-map{margin:6px -8px 0;height:150px}
.route-map svg{display:block;width:100%;height:100%;overflow:visible}
.rt-grid{stroke:var(--grid);stroke-width:1;stroke-dasharray:2 4;fill:none}
.rt-arc{stroke:var(--red);stroke-width:2.5;fill:none;stroke-linecap:round}
.rt-arc.ghost{opacity:.18;stroke-width:8}
.rt-pt{fill:var(--card);stroke:var(--ink);stroke-width:2}
.rt-pt.dest{stroke:var(--red);fill:var(--red)}
.rt-plane{fill:var(--red)}
@media (prefers-reduced-motion:no-preference){
  .route-map .rt-arc:not(.ghost){stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.1s .1s cubic-bezier(.4,0,.2,1) forwards}
  .route-map .rt-plane{opacity:0;animation:appear .2s 1.2s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes appear{to{opacity:1}}
}
.names{display:flex;justify-content:space-between;font-weight:600;margin-top:8px}
.facts{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}

.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.budget{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:center}
.big{font-family:var(--display);font-weight:600;font-size:2.8rem;line-height:1}
.muted{color:var(--muted)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--soft);margin-bottom:12px}
.bar i{display:block;height:100%}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 20px}
.legend li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:.95rem}
.legend .dot{width:12px;height:12px;border-radius:3px}

.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.day h3{display:flex;justify-content:space-between;gap:8px;font-size:1.02rem}
.day h3 small{color:var(--muted);font-weight:400;font-size:.88rem}
.day ul{margin:8px 0 0;padding-inline-start:18px}
.day p{margin:8px 0 0;color:var(--muted);white-space:pre-wrap;font-size:.95rem}
.day .empty{color:var(--muted);font-size:.93rem;margin-top:6px}

.j-day{margin-top:24px}
.j-day > h3{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:12px}
.j-day > h3 small{color:var(--muted);font-weight:400;font-size:.93rem}
.j-entry{margin-bottom:14px}
.j-entry h4{font-size:1.12rem}
.j-place{color:var(--muted);font-size:.92rem}
.j-text{white-space:pre-wrap;margin:8px 0 0;max-width:70ch}
.j-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.j-gallery button{padding:0;border:0;border-radius:8px;overflow:hidden;aspect-ratio:1/1;background:var(--soft);cursor:zoom-in}
.j-gallery img{width:100%;height:100%;object-fit:cover;display:block}

.state{text-align:center;padding:60px 20px}
.state h1{font-size:1.5rem;margin-bottom:8px}
.state a{color:var(--blue)}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(8,12,22,.92);display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 60px calc(20px + env(safe-area-inset-bottom,0px))}
.lightbox[hidden]{display:none}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb-btn{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;width:44px;height:44px;border-radius:50%;font-size:1.6rem;line-height:1;cursor:pointer}
.lb-btn:hover{background:rgba(255,255,255,.25)}
.lb-close{top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:14px}
.lb-prev{inset-inline-start:10px;top:50%;transform:translateY(-50%)}
.lb-next{inset-inline-end:10px;top:50%;transform:translateY(-50%)}
button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (max-width:720px){
  .wrap{padding:16px 12px 48px}
  .flight{padding:18px}
  .route-map{height:110px}
  .budget{grid-template-columns:1fr}
  .lightbox{padding-inline:8px}
  .lb-prev,.lb-next{top:auto;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:none}
}
@media print{ .top a,.lightbox{display:none} body{background:#fff} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span id="byline">טוען...</span>
    <a href="login.html">לתכנון טיול משלכם</a>
  </div>
  <main id="app"></main>
</div>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="תצוגת תמונה">
  <button class="lb-btn lb-close" id="lb-close" aria-label="סגירה">×</button>
  <button class="lb-btn lb-prev" id="lb-prev" aria-label="התמונה הקודמת">›</button>
  <img id="lb-img" alt="">
  <button class="lb-btn lb-next" id="lb-next" aria-label="התמונה הבאה">‹</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="route.js"></script>
<script>
(function(){
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CFG = window.TRIP_CONFIG || {};
const BUCKET = 'trip-photos';
const CATS = [
  {k:'flight',n:'טיסות',c:'var(--blue)'}, {k:'hotel',n:'לינה',c:'var(--red)'}, {k:'attr',n:'אטרקציות',c:'var(--amber)'},
  {k:'food',n:'אוכל',c:'var(--green)'}, {k:'transport',n:'תחבורה',c:'var(--violet)'}, {k:'other',n:'שונות',c:'var(--gray)'}
];
const DEFAULT_RATES = {USD:3.068, EUR:3.477, GBP:4.060, CZK:0.1424, HUF:0.00945};
const fmt = v => new Intl.NumberFormat('he-IL', {style:'currency', currency:'ILS', maximumFractionDigits:0}).format(v || 0);

function fail(title, text){
  $('#byline').textContent = 'הטיולים שלי';
  $('#app').innerHTML = `<div class="panel state"><h1>${esc(title)}</h1><p class="muted">${esc(text)}</p><p><a href="login.html">לאתר הטיולים</a></p></div>`;
}

const id = new URLSearchParams(location.search).get('trip');
if (!id || !/^[0-9a-f-]{36}$/i.test(id)) return fail('הקישור לא שלם', 'בדקו שהעתקתם את כל הקישור שקיבלתם.');
if (!window.supabase || !CFG.SUPABASE_URL || /YOUR-/.test(CFG.SUPABASE_URL + CFG.SUPABASE_ANON_KEY))
  return fail('האתר לא מוגדר', 'חסרות הגדרות Supabase בקובץ config.js.');
const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);

(async () => {
  const {data, error} = await sb.rpc('get_public_trip', {p_id: id});
  if (error) return fail('לא הצלחנו לטעון את הטיול', 'בדקו את החיבור לאינטרנט ורעננו את הדף.');
  if (!data) return fail('הטיול לא זמין', 'הטיול הזה לא קיים, או שמארגן הטיול הפסיק לשתף אותו.');
  render(data);
})();

function render(T){
  const st = T.state || {};
  const code = tripCode(st), coords = tripCoords(st);
  const place = st.dest === 'OTHER' ? [st.custom || 'יעד אחר', (st.geo && st.geo.country) || ''] : (PLACE_NAMES[st.dest] || [st.dest, '']);
  const placeTxt = place[1] ? place[0] + ', ' + place[1] : place[0];
  document.title = 'טיול ל' + place[0] + ' | הטיולים שלי';
  $('#byline').textContent = T.owner_name ? 'טיול של ' + T.owner_name : 'טיול משותף';

  const a = Date.parse(st.from), b = Date.parse(st.to);
  const diff = (isNaN(a) || isNaN(b)) ? 0 : Math.round((b - a) / 864e5);
  const days = Math.max(1, diff + 1), nights = Math.max(0, diff);
  const travelers = Math.max(1, parseInt(st.travelers, 10) || 1);
  const dfy = new Intl.DateTimeFormat('he-IL', {day:'numeric', month:'numeric', year:'numeric'});
  const range = (!isNaN(a) && !isNaN(b)) ? dfy.format(a) + ' עד ' + dfy.format(b) : '';
  let flightTxt = '';
  if (coords) {
    const km = distKm(AIRPORTS.TLV, coords);
    flightTxt = `<span><b class="num">${(Math.round(km/10)*10).toLocaleString('he-IL')}</b> ק״מ בקו אווירי</span>`;
  }

  let html = `<div class="flight">
    <div class="route"><div class="code ${/^[A-Z]{3}$/.test(code) ? '' : 'custom'}">${esc(code)}</div><div class="code origin">TLV</div></div>
    <div class="route-map" id="route-map" aria-hidden="true"></div>
    <div class="names"><span>תל אביב</span><span>${esc(placeTxt)}</span></div>
    <div class="facts">
      ${range ? `<span><b>${esc(range)}</b></span>` : ''}
      <span><b>${days}</b> ימים, <b>${nights}</b> לילות</span>
      <span><b>${travelers === 1 ? 'נוסע אחד' : travelers + ' נוסעים'}</b></span>
      ${flightTxt}
    </div>
  </div>`;

  // budget (only when the organizer chose to share it)
  if (T.has_budget && Array.isArray(st.items)) {
    const rates = {...DEFAULT_RATES, ...(st.rates || {})};
    const rate = c => c === 'ILS' ? 1 : (+rates[c] || 0);
    const mult = p => ({total:1, person:travelers, night:nights, day:days, personDay:travelers*days})[p] ?? 1;
    const by = {}; CATS.forEach(c => by[c.k] = 0);
    st.items.forEach(i => { by[i.cat] = (by[i.cat] || 0) + (+i.amount || 0) * rate(i.cur) * mult(i.per); });
    const all = Object.values(by).reduce((x, y) => x + y, 0);
    html += `<section><h2>תקציב משוער</h2><div class="panel budget">
      <div><div class="big num">${fmt(all)}</div><div class="muted">${fmt(all / travelers)} לנוסע, ${fmt(all / days)} ליום</div></div>
      <div><div class="bar">${all > 0 ? CATS.filter(c => by[c.k] > 0).map(c => `<i style="width:${by[c.k]/all*100}%;background:${c.c}"></i>`).join('') : ''}</div>
      <ul class="legend">${CATS.filter(c => by[c.k] > 0).map(c => `<li><span class="dot" style="background:${c.c}"></span><span>${c.n}</span><span class="num">${fmt(by[c.k])}</span></li>`).join('')}</ul></div>
    </div></section>`;
  }

  // day by day
  const attrs = (st.items || []).filter(i => i.cat === 'attr');
  const notes = st.notes || {};
  const dayFmt = new Intl.DateTimeFormat('he-IL', {weekday:'long', day:'numeric', month:'numeric'});
  const nDays = Math.min(days, 60);
  const dayCards = Array.from({length: nDays}, (_, i) => {
    const d = i + 1, list = attrs.filter(x => +x.day === d), note = (notes[d] || '').trim();
    const label = isNaN(a) ? '' : dayFmt.format(new Date(a + i * 864e5));
    return `<div class="panel day"><h3>יום ${d} <small>${esc(label)}</small></h3>
      ${list.length ? `<ul>${list.map(x => `<li>${esc(x.name || '')}</li>`).join('')}</ul>` : ''}
      ${note ? `<p>${esc(note)}</p>` : ''}
      ${!list.length && !note ? '<div class="empty">יום חופשי</div>' : ''}</div>`;
  }).join('');
  const unassigned = attrs.filter(x => !x.day || x.day > nDays);
  html += `<section><h2>התוכנית</h2>
    ${unassigned.length ? `<p class="muted">עוד אטרקציות בתוכנית: ${unassigned.map(x => esc(x.name)).join(', ')}</p>` : ''}
    <div class="days">${dayCards}</div></section>`;

  // journal
  const photosAll = [];
  if (T.has_journal && T.entries && T.entries.length) {
    const groups = new Map();
    T.entries.forEach(e => { const k = e.date || ''; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); });
    html += `<section><h2>יומן הטיול</h2>${[...groups.entries()].map(([date, es]) => {
      const dt = Date.parse(date);
      const n = (!isNaN(dt) && !isNaN(a)) ? Math.round((dt - a) / 864e5) + 1 : null;
      const head = n && n >= 1 && n <= days ? 'יום ' + n : (isNaN(dt) ? 'בלי תאריך' : dayFmt.format(dt));
      const sub = n && n >= 1 && n <= days ? dayFmt.format(dt) : '';
      return `<div class="j-day"><h3>${esc(head)} <small>${esc(sub)}</small></h3>${es.map(e => `
        <article class="panel j-entry">
          ${e.title ? `<h4>${esc(e.title)}</h4>` : ''}${e.place ? `<div class="j-place">📍 ${esc(e.place)}</div>` : ''}
          ${e.text ? `<p class="j-text">${esc(e.text)}</p>` : ''}
          ${(e.photos || []).length ? `<div class="j-gallery">${e.photos.map(pth => { photosAll.push(pth); const k = photosAll.length - 1;
            return `<button data-k="${k}" aria-label="הגדלת תמונה"><img data-path="${esc(pth)}" alt="" loading="lazy"></button>`; }).join('')}</div>` : ''}
        </article>`).join('')}</div>`;
    }).join('')}</section>`;
  }

  $('#app').innerHTML = html;
  const box = $('#route-map');
  box.innerHTML = routeSVG(st.dest, Math.max(300, Math.round(box.clientWidth || 640)), Math.round(box.clientHeight || 150), {coords});
  const arc = box.querySelectorAll('.rt-arc')[1];
  if (arc) box.style.setProperty('--len', Math.ceil(arc.getTotalLength()));
  if (photosAll.length) loadPhotos(photosAll);
}

const urls = new Map();
async function loadPhotos(paths){
  const uniq = [...new Set(paths)];
  for (let i = 0; i < uniq.length; i += 100) {
    const chunk = uniq.slice(i, i + 100);
    const {data} = await sb.storage.from(BUCKET).createSignedUrls(chunk, 3600);
    (data || []).forEach((d, k) => { if (d && d.signedUrl) urls.set(d.path || chunk[k], d.signedUrl); });
  }
  document.querySelectorAll('img[data-path]').forEach(img => { const u = urls.get(img.dataset.path); if (u) img.src = u; });
  const list = paths;
  let cur = 0;
  const show = () => { $('#lb-img').src = urls.get(list[cur]) || ''; $('#lb-prev').hidden = $('#lb-next').hidden = list.length < 2; };
  const close = () => { $('#lightbox').hidden = true; $('#lb-img').removeAttribute('src'); };
  const step = d => { cur = (cur + d + list.length) % list.length; show(); };
  $('#app').addEventListener('click', e => {
    const b = e.target.closest('[data-k]'); if (!b) return;
    cur = +b.dataset.k; show(); $('#lightbox').hidden = false; $('#lb-close').focus();
  });
  $('#lb-close').addEventListener('click', close);
  $('#lb-prev').addEventListener('click', () => step(-1));
  $('#lb-next').addEventListener('click', () => step(1));
  $('#lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') close(); });
  document.addEventListener('keydown', e => {
    if ($('#lightbox').hidden) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') step(1);   // RTL: left goes forward
    if (e.key === 'ArrowRight') step(-1);
  });
}
})();
</script>
</body>
</html>
